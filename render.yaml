# Render Blueprint for the Online Examination System
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repository.
# Requires a linked PostgreSQL instance (Neon recommended) - set its pooled
# connection string as `DATABASE_URL` and the direct one as `DIRECT_DATABASE_URL`.

databases: []

services:
  # ------------------------------------------------------------------ API ---
  - type: web
    name: oes-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma generate && pnpm build
    preDeployCommand: pnpm prisma migrate deploy
    startCommand: node dist/src/main.js
    healthCheckPath: /api/v1/monitoring/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false          # Neon POOLED url (?sslmode=require&pgbouncer=true&connection_limit=10)
      - key: DIRECT_DATABASE_URL
        sync: false          # Neon DIRECT url (used by prisma migrate deploy)
      - key: JWT_ACCESS_SECRET
        generateValue: true  # >=32 random chars
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false          # e.g. https://oes.vercel.app
      - key: CORS_ORIGIN
        sync: false          # same origin(s) as FRONTEND_URL (Socket.IO)
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
        # REQUIRED: the Vercel frontend and this Render API are different
        # sites, so browsers only send the auth cookies on cross-site XHR when
        # SameSite=None + Secure. If you later proxy /api through the same
        # domain as the frontend, you may switch back to `lax`.
      - key: COOKIE_PATH
        value: /
      # Set COOKIE_DOMAIN to ".yourdomain.com" ONLY if app+api are subdomains
      # of one registrable domain; leave unset for vercel.app/onrender.com.
      - key: SWAGGER_ENABLED
        value: "false"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_TTL
        value: "60"
      - key: RATE_LIMIT_LIMIT
        value: "120"
      # Proctoring analyzer. Browser clients call /monitoring/analyze and
      # /monitoring/audio on THIS backend, which verifies session ownership and
      # forwards the request to the trusted proctoring URL using PROCTORING_API_KEY.
      # Set PROCTORING_URL and the matching PROCTORING_API_KEY on the
      # oes-proctoring service below.
      - key: PROCTORING_URL
        value: https://oes-proctoring.onrender.com
      - key: PROCTORING_API_KEY
        sync: false
      # Web Push (VAPID). Enables the browser-notification pipeline
      # (GET /push/vapid-key + POST /push/subscriptions). All three must be
      # present or PushService stays disabled (vapid-key returns null).
      # Known-good values live in deployment/.env.production — paste them into
      # the oes-backend Environment tab as a secret, then reload the service.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: REDIS_URL
        sync: false
        # Redis Cloud connection string, e.g. rediss://default:<pass>@<host>:<port>
        # Used by the cache, BullMQ queues and the Socket.IO multi-instance adapter.
      # Initial SUPER_ADMIN bootstrap (server-side only, see backend/src/auth/superadmin.bootstrap.ts).
      # Used ONCE at first start to create the SUPER_ADMIN with a bcrypt hash; the
      # password is never overwritten afterwards. Never prefix with NEXT_PUBLIC_.
      - key: SUPERADMIN_EMAIL
        sync: false          # e.g. superadmin@example.com
      - key: SUPERADMIN_PASSWORD
        sync: false          # strong random string (>= 12 chars, mixed classes)

  # ------------------------------------------------------- Proctoring API ---
  - type: web
    name: oes-proctoring
    runtime: python
    plan: starter
    region: oregon
    rootDir: proctoring
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://oes.vercel.app (browser never calls this service directly; keep it private)
      - key: PROCTORING_API_KEY
        sync: false          # Secret, must match oes-backend PROCTORING_API_KEY. When set, /analyze and /audio reject unauthenticated callers.

# The Next.js frontend deploys on Vercel (Root Directory: frontend):
#   Build Command: cd .. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter frontend build
#   Output: .next  |  Install Command: (handled above)
# Env vars (set BEFORE building - they are inlined into the bundle):
#   NEXT_PUBLIC_API_URL       https://<oes-backend>.onrender.com/api/v1
#   NEXT_PUBLIC_SOCKET_URL    https://<oes-backend>.onrender.com/realtime
# (Analyzer frames/audio now travel through the authenticated API proxy, so
#  NEXT_PUBLIC_PROCTORING_URL is no longer required by the frontend.)
