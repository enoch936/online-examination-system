name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oes
          POSTGRES_PASSWORD: oes_password
          POSTGRES_DB: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter backend prisma:generate
        env:
          DATABASE_URL: postgresql://oes:oes_password@localhost:5432/oes?schema=public
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://oes:oes_password@localhost:5432/oes?schema=public
          JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_ci_access_secret
          JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refresh_secret
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000/realtime
