name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Test
        run: pnpm --filter frontend test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://example.com/api/v1
          NEXT_PUBLIC_SOCKET_URL: https://example.com/realtime
          NEXT_PUBLIC_PROCTORING_URL: https://example.com
        run: pnpm --filter frontend build

  backend:
    name: Backend (prisma, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Lint
        run: pnpm --filter backend lint

      - name: Test
        run: pnpm --filter backend test

      - name: Build
        run: pnpm --filter backend build

  backend-smoke:
    name: Backend production boot + health check (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oes
          POSTGRES_PASSWORD: ci_local_only_password
          POSTGRES_DB: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Build
        run: pnpm --filter backend build

      - name: Apply production migrations
        run: pnpm --filter backend prisma:deploy
        env:
          DATABASE_URL: postgresql://oes:ci_local_only_password@localhost:5432/oes?schema=public
          DIRECT_DATABASE_URL: postgresql://oes:ci_local_only_password@localhost:5432/oes?schema=public

      - name: Boot API in production mode and hit health endpoint
        env:
          NODE_ENV: production
          PORT: 4000
          API_PREFIX: api/v1
          DATABASE_URL: postgresql://oes:ci_local_only_password@localhost:5432/oes?schema=public
          DIRECT_DATABASE_URL: postgresql://oes:ci_local_only_password@localhost:5432/oes?schema=public
          JWT_ACCESS_SECRET: 36e9150ad41bcf54108675457595a45dab859a64c0039fb5
          JWT_REFRESH_SECRET: ab88a2e1dce36c5839de519bf5b7bc3ceb371686163a8c4f
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          FRONTEND_URL: https://example.com
          CORS_ORIGIN: https://example.com
          COOKIE_SECURE: 'true'
          COOKIE_SAME_SITE: none
          COOKIE_PATH: /
          SWAGGER_ENABLED: 'false'
          BCRYPT_ROUNDS: '10'
          RATE_LIMIT_TTL: '60'
          RATE_LIMIT_LIMIT: '120'
        run: |
          pnpm --filter backend start &
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/health.json http://localhost:4000/api/v1/monitoring/health; then
              echo "== health endpoint OK =="
              cat /tmp/health.json
              curl -fsS -o /tmp/ready.json http://localhost:4000/api/v1/monitoring/health/ready && echo "== ready endpoint OK ==" && cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy within 60s" >&2
          exit 1

  proctoring:
    name: Proctoring service (install + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: proctoring

      - name: Import check
        run: python -c "import main; assert main.app.title == 'Proctoring Signal Service'"
        working-directory: proctoring

      - name: Boot smoke test
        run: |
          PORT=8000 ENVIRONMENT=development ALLOWED_ORIGINS=http://localhost:3000 \
            uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            if curl -fsS -o /tmp/proc.json http://localhost:8000/health; then
              echo "== proctoring health OK =="
              cat /tmp/proc.json
              exit 0
            fi
            sleep 1
          done
          echo "proctoring did not become healthy" >&2
          exit 1
        working-directory: proctoring

  docker:
    name: Docker images + compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose configuration
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/.env.example config -q

      - name: Build backend image
        run: docker build -t oes-backend:ci -f docker/backend.Dockerfile .

      - name: Build frontend image
        run: |
          docker build -t oes-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=https://example.com/api/v1 \
            --build-arg NEXT_PUBLIC_SOCKET_URL=https://example.com/realtime \
            --build-arg NEXT_PUBLIC_PROCTORING_URL=https://example.com \
            -f docker/frontend.Dockerfile .